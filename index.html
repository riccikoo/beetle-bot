<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Laba-laba Sunda-bot</title>
    <style>
      :root {
        --bg: #ffffff;
        --text: #000000;
        --gray: #333333;
        --light-gray: #777777;
      }
      body {
        font-family: "Inter", -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        margin: 0;
      }

      /* Navigation Minimalist */
      nav {
        border-bottom: 1px solid var(--light-gray);
        display: flex;
        justify-content: center;
      }
      nav button {
        background: none;
        border: none;
        color: var(--gray);
        padding: 20px 40px;
        cursor: pointer;
        font-size: 12px;
        letter-spacing: 2px;
        transition: 0.3s;
      }
      nav button.active {
        color: var(--text);
        border-bottom: 2px solid var(--text);
      }

      .page {
        display: none;
        padding: 40px;
        text-align: center;
      }
      .page.active {
        display: block;
      }

      /* Dashboard Grid Sensor */
      .sensor-container {
        display: flex;
        justify-content: center;
        gap: 50px;
        margin-bottom: 40px;
        flex-wrap: wrap;
      }
      .sensor-box {
        border: 1px solid var(--gray);
        padding: 20px;
        border-radius: 4px;
        min-width: 200px;
      }

      /* Controller - Clean Look */
      .ctrl-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 100px;
        margin-top: 30px;
      }
      .arrow-grid {
        display: grid;
        grid-template-columns: repeat(3, 70px);
        gap: 15px;
      }
      .key {
        width: 70px;
        height: 70px;
        border: 1px solid var(--gray);
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        transition: 0.1s;
        color: var(--light-gray);
        cursor: pointer;
        user-select: none;
      }
      .key.active {
        background: rgb(0, 0, 0);
        color: rgb(255, 255, 255);
        border-color: rgb(0, 0, 0);
        transform: translateY(-2px);
      }

      /* Color Display box */
      #color-preview {
        width: 50px;
        height: 25px;
        margin: 10px auto;
        border: 1px solid #333;
        background-color: #777;
        border-radius: 3px;
        transition: 0.3s;
      }

      #connect-btn {
        position: fixed;
        bottom: 30px;
        left: 30px;
        background: #000;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 2px;
        font-weight: bold;
        font-size: 11px;
        letter-spacing: 1px;
      }

      h2 {
        font-weight: 300;
        letter-spacing: 5px;
        margin-bottom: 40px;
        font-size: 18px;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <nav>
      <button id="btn-nav-ctrl" class="active">CONTROL panel</button>
    </nav>

    <div id="controller" class="page active">
      <h2>Manual Operation</h2>

      <div class="sensor-container">
        <div class="sensor-box">
          <div style="font-size: 10px; color: #777; letter-spacing: 2px">PROXIMITY SENSOR</div>
          <div id="ultra-val" style="font-size: 36px; font-weight: 200; margin: 10px 0;">00<span style="font-size: 18px"> cm</span></div>
          <div style="width: 100%; height: 3px; background: #222; position: relative;">
            <div id="ultra-bar" style="width: 0%; height: 100%; background: black; transition: 0.3s"></div>
          </div>
        </div>

        <div class="sensor-box">
          <div style="font-size: 10px; color: #777; letter-spacing: 2px">COLOR DETECTOR (TCS3200)</div>
          <div id="color-text" style="font-size: 20px; font-weight: 400; margin-top: 10px;">SCANNING...</div>
          <div id="color-preview"></div>
          <div id="rgb-raw" style="font-size: 11px; color: #777; font-family: monospace;">R:0 | G:0 | B:0</div>
        </div>
      </div>

      <div class="ctrl-wrapper">
        <div class="arrow-grid">
          <div></div>
          <div id="key-Up" class="key" mousedown="sendCmd('maju')">↑</div>
          <div></div>
          <div id="key-Left" class="key" mousedown="sendCmd('kiri')">←</div>
          <div id="key-Stop" class="key" style="color:red;" mousedown="sendCmd('stop')">■</div>
          <div id="key-Right" class="key" mousedown="sendCmd('kanan')">→</div>
          <div></div>
          <div id="key-Down" class="key" mousedown="sendCmd('mundur')">↓</div>
          <div></div>
        </div>
      </div>
    </div>

    <button id="connect-btn">ESP32 LINK ACTIVE</button>

    <script>
      // Mengirimkan command gerakan via HTTP Request Asinkron (Fetch) tanpa Reload Halaman
      function sendCmd(endpoint) {
        fetch(`/${endpoint}`)
          .then(response => console.log(`Cmd: ${endpoint} sukses`))
          .catch(err => console.error("Koneksi Error:", err));
      }

      // Keyboard Mapping & Event
      const keyMap = {
        ArrowUp: { path: "maju", id: "key-Up" },
        ArrowDown: { path: "mundur", id: "key-Down" },
        ArrowLeft: { path: "kiri", id: "key-Left" },
        ArrowRight: { path: "kanan", id: "key-Right" },
        Escape: { path: "stop", id: "key-Stop" },
        Space: { path: "stop", id: "key-Stop" }
      };

      let activeKey = null;

      window.addEventListener("keydown", (e) => {
        const keyData = keyMap[e.key] || (e.code === "Space" ? keyMap["Space"] : null);
        if (keyData && activeKey !== e.key) {
          activeKey = e.key;
          document.getElementById(keyData.id)?.classList.add("active");
          sendCmd(keyData.path);
        }
      });

      window.addEventListener("keyup", (e) => {
        const keyData = keyMap[e.key] || (e.code === "Space" ? keyMap["Space"] : null);
        if (keyData) {
          activeKey = null;
          document.getElementById(keyData.id)?.classList.remove("active");
          sendCmd("stop");
        }
      });

      // Mouse/Touch Klik support untuk tombol UI
      document.querySelectorAll('.key').forEach(button => {
        button.addEventListener('mousedown', function() {
          const targetId = this.id;
          if(targetId === "key-Up") sendCmd("maju");
          if(targetId === "key-Down") sendCmd("mundur");
          if(targetId === "key-Left") sendCmd("kiri");
          if(targetId === "key-Right") sendCmd("kanan");
          if(targetId === "key-Stop") sendCmd("stop");
        });
        button.addEventListener('mouseup', () => sendCmd("stop"));
      });

      // Polling Data Telemetri secara berkala dari ESP32 (Jarak & Warna)
      setInterval(() => {
        fetch('/telemetri')
          .then(res => res.json())
          .then(data => {
            // Update UI Jarak
            document.getElementById("ultra-val").innerHTML = `${data.jarak}<span style="font-size: 18px;"> cm</span>`;
            let percent = Math.min(data.jarak * 4, 100); 
            document.getElementById("ultra-bar").style.width = percent + "%";
            document.getElementById("ultra-val").style.color = data.jarak < 15 ? "#ff4444" : "black";

            // Update UI Warna asli durasi pulsa TCS3200
            document.getElementById("rgb-raw").innerText = `R:${data.r} | G:${data.g} | B:${data.b}`;
            
            if (data.isManusia) {
              document.getElementById("color-text").innerText = "TARGET: MANUSIA (RED)";
              document.getElementById("color-text").style.color = "#ff4444";
              document.getElementById("color-preview").style.backgroundColor = "#ff4444";
            } else {
              document.getElementById("color-text").innerText = "OBJECT DETECTED";
              document.getElementById("color-text").style.color = "black";
              document.getElementById("color-preview").style.backgroundColor = "#777777";
            }
          })
          .catch(err => console.log("Gagal mengambil data sensor"));
      }, 400); // Sinkronisasi setiap 400ms
    </script>
  </body>
</html>
